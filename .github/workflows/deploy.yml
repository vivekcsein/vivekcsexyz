name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job can only read the repo. Only the deploy job
# gets the two extra scopes Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # keep in sync with packageManager in package.json

      # --ignore-scripts: dependency install scripts never run in CI.
      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run lint

      # `bun run build` = themes:build -> next build -> postbuild
      # (postbuild injects the CSP and, because CI=true, FAILS the build on
      # localhost URLs, inline handlers, javascript: URLs or unexpected
      # third-party scripts).
      - run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GH_PROJECT_PAGES: ${{ vars.NEXT_PUBLIC_GH_PROJECT_PAGES }}
          NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_RAIL: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RAIL }}
          NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
